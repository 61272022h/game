<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Webduino Bit 實體按鈕測試專用版</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Webduino Bit 官方函式庫 -->
  <script src="https://blocklypro.webduino.io/components/jquery/dist/jquery.min.js" defer></script>
  <script src="https://blocklypro.webduino.io/dist/lib/webduino-all-0.4.20.min.js" defer></script>
  <script src="https://blocklypro.webduino.io/dist/webduino-blockly.min.js" defer></script>
  <script src="https://blocklypro.webduino.io/dist/lib/firebase.min.js" defer></script>
  <script src="https://blocklypro.webduino.io/dist/lib/runtime.min.js" defer></script>
  <script src="https://bit.webduino.io/blockly/components/webduino-bit-module-button/BitButton.js" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans TC', 'Inter', sans-serif; }
    @keyframes popGlow {
      0% { transform: scale(1); }
      40% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    .key-active {
      animation: popGlow 0.25s ease-out;
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.75);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 sm:p-8">
  <div class="max-w-2xl mx-auto space-y-5">

    <!-- 標題 -->
    <header class="text-center space-y-1">
      <div class="inline-block bg-sky-500/20 text-sky-300 border border-sky-500/40 text-xs font-extrabold px-3 py-1 rounded-full">
        WEBDUINO BIT // HARDWARE BUTTON TESTER
      </div>
      <h1 class="text-2xl sm:text-3xl font-black text-white">Webduino Bit 實體按鈕連線測試版</h1>
      <p class="text-xs sm:text-sm text-slate-400">按實體 A 鍵 (+1)、按實體 B 鍵 (確認)、同時按 A + B (歸零)</p>
    </header>

    <!-- 1. Device ID 連線區 -->
    <section class="bg-slate-900 border-2 border-sky-500/60 rounded-2xl p-4 sm:p-5 shadow-xl space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <label for="deviceIdInput" class="text-sm sm:text-base font-extrabold text-sky-300">
          1️⃣ 請填入 Webduino Bit 的 Device ID：
        </label>
        <span id="connStatusBadge" class="text-xs font-extrabold px-3 py-1 rounded-full bg-slate-800 text-slate-300">
          🔴 尚未連線
        </span>
      </div>

      <div class="flex gap-2">
        <input
          type="text"
          id="deviceIdInput"
          placeholder="例如：bit47e4bb"
          class="flex-1 bg-slate-950 border border-slate-700 focus:border-sky-400 rounded-xl px-4 py-2.5 text-base font-mono text-white focus:outline-none"
        />
        <button
          type="button"
          onclick="connectBoard()"
          class="px-5 py-2.5 rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-black text-sm sm:text-base shadow transition active:scale-95 shrink-0"
        >
          立即連線
        </button>
      </div>

      <div id="signalBanner" class="bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs sm:text-sm font-bold text-amber-300">
        ⏳ 請輸入板子 Device ID 並點擊「立即連線」，連上後即可按實體按鈕測試。
      </div>
    </section>

    <!-- 2. Webduino Bit 實體開發板互動視覺圖 + 數字區 -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 sm:p-6 shadow-xl text-center space-y-5">
      <div class="text-sm font-bold text-slate-400">2️⃣ 開發板即時按鍵圖示與計數器</div>

      <!-- SVG 擬真 Web:Bit 開發板圖示 -->
      <div class="flex justify-center">
        <div class="bg-slate-950 border-2 border-slate-700 rounded-3xl p-4 shadow-2xl inline-block">
          <svg viewBox="0 0 340 160" class="w-72 sm:w-80 h-auto select-none">
            <!-- PCB 主板外框 -->
            <rect x="6" y="6" width="328" height="148" rx="22" fill="#1e293b" stroke="#475569" stroke-width="3" />
            <!-- 底部金手指接點 -->
            <g fill="#facc15" opacity="0.85">
              <rect x="35" y="138" width="14" height="16" rx="3" />
              <rect x="65" y="138" width="14" height="16" rx="3" />
              <rect x="95" y="138" width="14" height="16" rx="3" />
              <rect x="130" y="138" width="10" height="16" rx="2" />
              <rect x="148" y="138" width="10" height="16" rx="2" />
              <rect x="166" y="138" width="10" height="16" rx="2" />
              <rect x="184" y="138" width="10" height="16" rx="2" />
              <rect x="202" y="138" width="10" height="16" rx="2" />
              <rect x="230" y="138" width="14" height="16" rx="3" />
              <rect x="260" y="138" width="14" height="16" rx="3" />
              <rect x="290" y="138" width="14" height="16" rx="3" />
            </g>

            <!-- 左側實體 A 按鈕 -->
            <g id="svgBtnA" class="cursor-pointer" onclick="handleButtonEvent('A', '點擊板子圖示')">
              <rect x="24" y="42" width="54" height="54" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
              <circle id="svgCircleA" cx="51" cy="69" r="16" fill="#0284c7" />
              <text x="51" y="114" text-anchor="middle" fill="#7dd3fc" font-size="13" font-weight="900">按鈕 A (+1)</text>
            </g>

            <!-- 中央 5x5 LED 矩陣燈 -->
            <rect x="108" y="24" width="124" height="96" rx="12" fill="#090d16" stroke="#334155" stroke-width="2" />
            <g id="svgLedGrid">
              <!-- 第一列 -->
              <circle cx="130" cy="40" r="5" fill="#1e293b" />
              <circle cx="150" cy="40" r="5" fill="#1e293b" />
              <circle cx="170" cy="40" r="5" fill="#1e293b" />
              <circle cx="190" cy="40" r="5" fill="#1e293b" />
              <circle cx="210" cy="40" r="5" fill="#1e293b" />
              <!-- 第二列 -->
              <circle cx="130" cy="56" r="5" fill="#1e293b" />
              <circle cx="150" cy="56" r="5" fill="#1e293b" />
              <circle cx="170" cy="56" r="5" fill="#1e293b" />
              <circle cx="190" cy="56" r="5" fill="#1e293b" />
              <circle cx="210" cy="56" r="5" fill="#1e293b" />
              <!-- 第三列 -->
              <circle cx="130" cy="72" r="5" fill="#1e293b" />
              <circle cx="150" cy="72" r="5" fill="#1e293b" />
              <circle cx="170" cy="72" r="5" fill="#1e293b" />
              <circle cx="190" cy="72" r="5" fill="#1e293b" />
              <circle cx="210" cy="72" r="5" fill="#1e293b" />
              <!-- 第四列 -->
              <circle cx="130" cy="88" r="5" fill="#1e293b" />
              <circle cx="150" cy="88" r="5" fill="#1e293b" />
              <circle cx="170" cy="88" r="5" fill="#1e293b" />
              <circle cx="190" cy="88" r="5" fill="#1e293b" />
              <circle cx="210" cy="88" r="5" fill="#1e293b" />
              <!-- 第五列 -->
              <circle cx="130" cy="104" r="5" fill="#1e293b" />
              <circle cx="150" cy="104" r="5" fill="#1e293b" />
              <circle cx="170" cy="104" r="5" fill="#1e293b" />
              <circle cx="190" cy="104" r="5" fill="#1e293b" />
              <circle cx="210" cy="104" r="5" fill="#1e293b" />
            </g>

            <!-- 右側實體 B 按鈕 -->
            <g id="svgBtnB" class="cursor-pointer" onclick="handleButtonEvent('B', '點擊板子圖示')">
              <rect x="262" y="42" width="54" height="54" rx="12" fill="#0f172a" stroke="#fbbf24" stroke-width="2.5" />
              <circle id="svgCircleB" cx="289" cy="69" r="16" fill="#d97706" />
              <text x="289" y="114" text-anchor="middle" fill="#fcd34d" font-size="13" font-weight="900">按鈕 B (確認)</text>
            </g>
          </svg>
        </div>
      </div>

      <!-- 目前數字與最後確認數字 -->
      <div class="flex items-center justify-center gap-6">
        <div class="bg-slate-950 border-2 border-amber-400 rounded-2xl w-32 h-36 flex flex-col items-center justify-center shadow-inner">
          <span class="text-xs font-bold text-amber-300 mb-1">目前數字</span>
          <span id="currentNumDisplay" class="text-6xl font-black font-mono text-white">0</span>
        </div>

        <div class="bg-slate-950 border-2 border-emerald-500/60 rounded-2xl w-32 h-36 flex flex-col items-center justify-center shadow-inner">
          <span class="text-xs font-bold text-emerald-300 mb-1">最後確認數字</span>
          <span id="confirmedNumDisplay" class="text-6xl font-black font-mono text-emerald-400">-</span>
        </div>
      </div>

      <!-- 三種按鍵狀態卡片 -->
      <div class="grid grid-cols-3 gap-3 pt-2">
        <div id="cardKeyA" class="bg-slate-950 border-2 border-slate-800 rounded-xl p-3 transition-all">
          <div class="text-base sm:text-lg font-black text-sky-400">A 鍵</div>
          <div id="stateKeyA" class="text-xs font-bold text-slate-400 mt-1">未觸發（+1）</div>
        </div>

        <div id="cardKeyAB" class="bg-slate-950 border-2 border-slate-800 rounded-xl p-3 transition-all">
          <div class="text-base sm:text-lg font-black text-purple-400">A + B 同時按</div>
          <div id="stateKeyAB" class="text-xs font-bold text-slate-400 mt-1">未觸發（歸零）</div>
        </div>

        <div id="cardKeyB" class="bg-slate-950 border-2 border-slate-800 rounded-xl p-3 transition-all">
          <div class="text-base sm:text-lg font-black text-amber-400">B 鍵</div>
          <div id="stateKeyB" class="text-xs font-bold text-slate-400 mt-1">未觸發（確認）</div>
        </div>
      </div>

      <!-- 網頁測試按鈕 -->
      <div class="pt-2 border-t border-slate-800 flex flex-wrap justify-center gap-2">
        <button type="button" onclick="handleButtonEvent('A', '網頁模擬')" class="px-4 py-2 rounded-xl bg-sky-600/30 hover:bg-sky-600/50 border border-sky-500/50 text-sky-200 text-xs font-bold">
          模擬按 A (+1)
        </button>
        <button type="button" onclick="handleButtonEvent('B', '網頁模擬')" class="px-4 py-2 rounded-xl bg-amber-600/30 hover:bg-amber-600/50 border border-amber-500/50 text-amber-200 text-xs font-bold">
          模擬按 B (確認)
        </button>
